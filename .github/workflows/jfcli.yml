      RT_REPO_VIRTUAL: "spring-petclinic-ms-discovery-server-virtual"

  mvn_genai-service:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    name: "MVN: genai-service"
    uses: ./.github/workflows/jfcli-commons.yml
    secrets: inherit
    with:

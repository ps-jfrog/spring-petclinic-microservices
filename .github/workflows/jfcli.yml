      APPLICATION_KEY: "customers-service"
      BUILD_PROFILE: "MVN"
      BUILD_NAME: "customers-service"
      BUILD_ID: "ga-mvn${{ github.run_number }}" 
      RT_REPO_VIRTUAL: "spring-petclinic-ms-customers-service-virtual"

  mvn_discovery-server:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    name: "MVN: discovery-server"
    uses: ./.github/workflows/jfcli-commons.yml
    secrets: inherit

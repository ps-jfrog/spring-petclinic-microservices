name: "AppTrust: Package"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  mvn_api-gateway:
    name: "MVN: api-gateway"
    uses: ./.github/workflows/jfcli-commons.yml
    secrets: inherit
    with:
      PROJECT_KEY: "spring-petclinic-ms"
      APPLICATION_KEY: "api-gateway"
      BUILD_PROFILE: "MVN"
      BUILD_NAME: "api-gateway"
      BUILD_ID: "ga-${{ github.run_number }}" 
      RT_REPO_VIRTUAL: "spring-petclinic-ms-api-gateway-virtual"

  mvn_config-server:
    name: "MVN: config-server"
    uses: ./.github/workflows/jfcli-commons.yml
    secrets: inherit
    with:
      PROJECT_KEY: "spring-petclinic-ms"
      APPLICATION_KEY: "config-server"
      BUILD_PROFILE: "MVN"
      BUILD_NAME: "config-server"
      BUILD_ID: "ga-${{ github.run_number }}" 
      RT_REPO_VIRTUAL: "spring-petclinic-ms-config-server-virtual"

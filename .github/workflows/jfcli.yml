name: "AppTrust: Package"

on:
  push:
  workflow_dispatch:
    inputs:
      APPLICATION_KEY:
        description: "AppTrust / module key"
        required: true
        type: choice
        options:
          - api-gateway
          - config-server
          - customers-service
          - discovery-server
          - genai-service
          - admin-server
          - vets-service
          - visits-service
      BUILD_PROFILE:
        description: "Build profile"
        required: true
        type: choice
        default: "MVN"
        options:
          - MVN
          - DOCKER
      PREDICATE_TYPE:
        description: "Predicate type"
        required: true
        type: choice
        options:  # refernce: https://docs.jfrog.com/governance/docs/evidence-payload, 
          - https://jfrog.com/evidence/test-results/v1
          - https://jfrog.com/evidence/approval/v1
          - https://jfrog.com/evidence/distribution/v1
          - https://slsa.dev/provenance/v1
          - http://atlassian.com/jira/issues/v1
          - https://sonar.com/evidence/sonarqube/v1
          - https://in-toto.io/Statement/v1
          - https://jfrog.com/evidence/promotion/v1
          - https://cyclonedx.org/bom/v1.4
          - https://spdx.dev/Document/v2.2
permissions:
  contents: read
  id-token: write
  actions: read

jobs:
# Manual Run: Executes dynamically based on UI selection
  mvn_manual-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: "Manual: ${{ inputs.APPLICATION_KEY }}"
    uses: ./.github/workflows/jfcli-commons.yml
    secrets: inherit
    with:
      PROJECT_KEY: "spring-petclinic-ms"
      APPLICATION_KEY: ${{ inputs.APPLICATION_KEY }}
      BUILD_PROFILE: ${{ inputs.BUILD_PROFILE }}
      BUILD_NAME: ${{ inputs.APPLICATION_KEY }}
      BUILD_ID: "ga-${{ github.run_number }}"
      RT_REPO_VIRTUAL: "spring-petclinic-ms-${{ inputs.APPLICATION_KEY }}-virtual"

# Push Trigger: 
  mvn_api-gateway:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    name: "MVN: api-gateway"
    uses: ./.github/workflows/jfcli-commons.yml
    secrets: inherit
    with:
      PROJECT_KEY: "spring-petclinic-ms"
      APPLICATION_KEY: "api-gateway"
      BUILD_PROFILE: "MVN"
      BUILD_NAME: "api-gateway"
      BUILD_ID: "ga-mvn-${{ github.run_number }}" 
      RT_REPO_VIRTUAL: "spring-petclinic-ms-api-gateway-virtual"

  mvn_config-server:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    name: "MVN: config-server"
    uses: ./.github/workflows/jfcli-commons.yml
    secrets: inherit
    with:
      PROJECT_KEY: "spring-petclinic-ms"
      APPLICATION_KEY: "config-server"
      BUILD_PROFILE: "MVN"
      BUILD_NAME: "config-server"
      BUILD_ID: "ga-mvn-${{ github.run_number }}" 
      RT_REPO_VIRTUAL: "spring-petclinic-ms-config-server-virtual"

  mvn_customers-service:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    name: "MVN: customers-service"
    uses: ./.github/workflows/jfcli-commons.yml
    secrets: inherit
    with:
      PROJECT_KEY: "spring-petclinic-ms"
      APPLICATION_KEY: "customers-service"
      BUILD_PROFILE: "MVN"
      BUILD_NAME: "customers-service"
      BUILD_ID: "ga-mvn-${{ github.run_number }}" 
      RT_REPO_VIRTUAL: "spring-petclinic-ms-customers-service-virtual"

  mvn_discovery-server:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    name: "MVN: discovery-server"
    uses: ./.github/workflows/jfcli-commons.yml
    secrets: inherit
    with:
      PROJECT_KEY: "spring-petclinic-ms"
      APPLICATION_KEY: "discovery-server"
      BUILD_PROFILE: "MVN"
      BUILD_NAME: "discovery-server"
      BUILD_ID: "ga-mvn-${{ github.run_number }}" 
      RT_REPO_VIRTUAL: "spring-petclinic-ms-discovery-server-virtual"

  mvn_genai-service:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    name: "MVN: genai-service"
    uses: ./.github/workflows/jfcli-commons.yml
    secrets: inherit
    with:
      PROJECT_KEY: "spring-petclinic-ms"
      APPLICATION_KEY: "genai-service"
      BUILD_PROFILE: "MVN"
      BUILD_NAME: "genai-service"
      BUILD_ID: "ga-mvn-${{ github.run_number }}" 
      RT_REPO_VIRTUAL: "spring-petclinic-ms-genai-service-virtual"

  mvn_admin-server:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    name: "MVN: admin-server"
    uses: ./.github/workflows/jfcli-commons.yml
    secrets: inherit
    with:
      PROJECT_KEY: "spring-petclinic-ms"
      APPLICATION_KEY: "admin-server"
      BUILD_PROFILE: "MVN"
      BUILD_NAME: "admin-server"
      BUILD_ID: "ga-mvn-${{ github.run_number }}" 
      RT_REPO_VIRTUAL: "spring-petclinic-ms-admin-server-virtual"

  mvn_vets-service:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    name: "MVN: vets-service"
    uses: ./.github/workflows/jfcli-commons.yml
    secrets: inherit
    with:
      PROJECT_KEY: "spring-petclinic-ms"
      APPLICATION_KEY: "vets-service"
      BUILD_PROFILE: "MVN"
      BUILD_NAME: "vets-service"
      BUILD_ID: "ga-mvn-${{ github.run_number }}" 
      RT_REPO_VIRTUAL: "spring-petclinic-ms-vets-service-virtual"

  mvn_visits-service:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    name: "MVN: visits-service"
    uses: ./.github/workflows/jfcli-commons.yml
    secrets: inherit
    with:
      PROJECT_KEY: "spring-petclinic-ms"
      APPLICATION_KEY: "visits-service"
      BUILD_PROFILE: "MVN"
      BUILD_NAME: "visits-service"
      BUILD_ID: "ga-mvn-${{ github.run_number }}" 
      RT_REPO_VIRTUAL: "spring-petclinic-ms-visits-service-virtual"

  mvn_multi-apps-version:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    name: "MVN: multi-apps-version"
    needs: [mvn_api-gateway, mvn_config-server, mvn_customers-service, mvn_discovery-server, mvn_genai-service, mvn_admin-server, mvn_vets-service, mvn_visits-service]
    runs-on: ubuntu-latest
    env:
      PROJECT_KEY: "spring-petclinic-ms"
      APPLICATION_KEY: "all-app-services" #"_AGGREGATE_"
      APPLICATION_VERSION: "ga-mvn-${{ github.run_number }}"
      BUILD_NAME: "multi-apps"
    steps:
      - name: "Setup JFrog CLI"
        uses: jfrog/setup-jfrog-cli@v5
        id: setup-cli
        env:
          JF_URL: "https://${{ vars.JF_NAME }}.jfrog.io"
          JF_PROJECT: "${{env.PROJECT_KEY}}"
          JFROG_CLI_LOG_LEVEL: DEBUG
        with:
          oidc-provider-name: ${{ vars.JF_OIDC_PROVIDER_NAME }}
          disable-job-summary: "false"

      - name: "MVN: Multi-Apps Version"
        env:
          ALL_APPS_SPEC_JSON: "./jfcli-all-apps-from-vc-spec.json"
        run: |
          cat > "${{ env.ALL_APPS_SPEC_JSON }}" <<EOF
          {
          "versions": [
            {
              "application_key": "api-gateway",
              "version": "${{ env.APPLICATION_VERSION }}"
            },
            {
              "application_key": "config-server",
              "version": "${{ env.APPLICATION_VERSION }}"
            }, 
            {
                "application_key": "customers-service",
                "version": "${{ env.APPLICATION_VERSION }}"
            },
            {
              "application_key": "discovery-server",
              "version": "${{ env.APPLICATION_VERSION }}"
            },
            {
              "application_key": "genai-service",
              "version": "${{ env.APPLICATION_VERSION }}"
            },
            {
              "application_key": "admin-server",
              "version": "${{ env.APPLICATION_VERSION }}"
            },
            {
              "application_key": "vets-service",
              "version": "${{ env.APPLICATION_VERSION }}"
            },
            {
              "application_key": "visits-service",
              "version": "${{ env.APPLICATION_VERSION }}"
            }
            ]
          }
          EOF
    
          cat "${{ env.ALL_APPS_SPEC_JSON }}" 
          jf apptrust version-create "${{ env.APPLICATION_KEY }}" "${{ env.APPLICATION_VERSION }}" --spec="${{ env.ALL_APPS_SPEC_JSON }}" --tag="Package" # ref: https://docs.jfrog.com/governance/docs/create-application-version-cli

# Evidence: Unit Test report for 
          # echo "ARTIFACT_NAME=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_ENV
          # echo "ARTIFACT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
          # echo "SHORT_COMMIT_CODE=" >> $GITHUB_ENV
          # echo "TODAYS_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
      - name: "EVD: Unit Test report"
        env:
          PROVIDER_ID: "junit"
          EVD_SPEC_JSON: './evd-spec-${{env.APPLICATION_KEY}}-${{env.APPLICATION_VERSION}}.json'  # ref https://jfrog.com/help/r/jfrog-artifactory-documentation/evidence-setup
          EVD_SPEC_MARKDOWN: './evd-spec-${{env.APPLICATION_KEY}}-${{env.APPLICATION_VERSION}}.md'
          PREDICATE_TYPE: "https://jfrog.com/evidence/test-results/v1"  # ref: https://docs.jfrog.com/governance/docs/evidence-payload
          JUNIT_TOTAL: 100
          JUNIT_PASSED: 100
          JUNIT_FAILED: 0
          JUNIT_SKIPPED: 0
          JUNIT_DURATION: 60
          SUCCESS_RATE: 100
          NOW_SHORT: $(date +'%Y-%m-%d %H:%M:%S')
        run: |
          
          cat > "${{env.EVD_SPEC_JSON}}" << JUNITEOF
          {
            "test_summary": {
              "total_tests": ${{env.JUNIT_TOTAL}},
              "passed_tests": ${{env.JUNIT_PASSED}},
              "failed_tests": ${{env.JUNIT_FAILED}},
              "skipped_tests": ${{env.JUNIT_SKIPPED}},
              "test_duration": ${{env.JUNIT_DURATION}},
              "success_rate": ${{env.SUCCESS_RATE}}
            },
            "test_details": [],
            "test_cases": [],
            "NOW_SHORT": "${{env.NOW_SHORT}}",
            "build_name": "${{env.APPLICATION_KEY}}",
            "build_id": "${{env.APPLICATION_VERSION}}",
            "build_promote_stage": "INITIAL_BUILD
          }
          JUNITEOF
          cat "${{env.EVD_SPEC_JSON}}"

          # Build markdown matching real payload format
          cat > "${{env.EVD_SPEC_MARKDOWN}}" << JUNITMAKDEOF
          # Test Results Report
          ## Test Summary

          **Overall Success Rate:${{env.SUCCESS_RATE}}%**

          | Metric | Value |
          |--------|-------|
          | **Total Tests** | ${{env.JUNIT_TOTAL}} |
          | **Passed** | ${{env.JUNIT_PASSED}} |
          | **Failed** | ${{env.JUNIT_FAILED}} |
          | **Skipped** | ${{env.JUNIT_SKIPPED}} |
          | **Duration** | ${{env.JUNIT_DURATION}} |
          | **Success Rate** | ${{env.SUCCESS_RATE}}% |

          **Report generated on:** ${{env.NOW_SHORT}}
          JUNITMAKDEOF
          cat "${{env.EVD_SPEC_MARKDOWN}}"

          jf evd create --application-key="${{env.APPLICATION_KEY}}" --application-version="${{env.APPLICATION_VERSION}}" --provider-id="${{env.PROVIDER_ID}}" --predicate="${{env.EVD_SPEC_JSON}}" --predicate-type="${{env.PREDICATE_TYPE}}" --key="${{secrets.KRISHNAM_JFROG_EVD_PRIVATEKEY}}" --key-alias="${{secrets.EVIDENCE_KEY_ALIAS}}" 


      - name: "Summary"
        run: |
          echo "Project key: ${{env.PROJECT_KEY}}"
          echo "Application key: ${{ env.APPLICATION_KEY }}"
          echo "Application version: ${{ env.APPLICATION_VERSION }}"





name: "Frogbot Scan"
on: push
permissions:
  pull-requests: write
  contents: read
  security-events: write
  # [Mandatory if using OIDC authentication protocol instead of JF_ACCESS_TOKEN]
  # id-token: write

jobs:
  scan-pull-request:
    runs-on: ubuntu-latest
    environment: frogbot
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: jfrog/frogbot@v3  # ref: https://github.com/jfrog/frogbot
        env:
          JF_URL: "https://${{vars.JF_NAME}}.jfrog.io"
          JF_PROJECT: "spring-petclinic-ms"
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ACTIONS_ALLOW_UNSECURE_NODE_VERSION: true 
          JF_WORKING_DIR: .
          JF_PATH_EXCLUSIONS: "*git*;*node_modules*;*target*;*venv*;*test*"
          JF_FAIL: "FALSE"
          JF_MIN_SEVERITY: "Low"
          JF_INCLUDE_ALL_VULNERABILITIES: "TRUE"
        with:
            version: latest
            oidc-provider-name: ${{ vars.JF_OIDC_PROVIDER_NAME }}